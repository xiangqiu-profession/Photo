<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D旋转相册</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="album">
            <div class="photo" style="--i:0;"></div>
            <div class="photo" style="--i:1;"></div>
            <div class="photo" style="--i:2;"></div>
            <div class="photo" style="--i:3;"></div>
            <div class="photo" style="--i:4;"></div>
            <div class="photo" style="--i:5;"></div>
            
            <!-- 内层小立方体 -->
            <div class="inner-album">
                <div class="inner-photo"></div>
                <div class="inner-photo"></div>
                <div class="inner-photo"></div>
                <div class="inner-photo"></div>
                <div class="inner-photo"></div>
                <div class="inner-photo"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
